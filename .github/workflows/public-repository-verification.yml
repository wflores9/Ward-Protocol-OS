name: Public Repository Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -r requirements.txt
      - name: Run all active deterministic Python tests
        run: python -m pytest tests sdk/python/tests -q -m 'not integration'

  offline-evidence-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay archived observations (not live provenance)
        run: python scripts/replay_historical_devnet.py --out offline-devnet-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-devnet-replay
          path: offline-devnet-replay.json

  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - name: Audit root and Python SDK requirements
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r sdk/python/requirements.txt

  npm-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and audit both lockfiles
        run: |
          npm ci
          npm audit
          npm ci --prefix sdk/typescript
          npm audit --prefix sdk/typescript
      - name: Check heartbeat, Worker build, and TypeScript SDK
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run test:certificate-heartbeat
          npx wrangler deploy --dry-run --config wrangler.certificate-heartbeat.jsonc
          npm --prefix sdk/typescript test -- --runInBand
          npm --prefix sdk/typescript run build

  git-history-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan all fetched history and source tree
        run: |
          /tmp/gitleaks git --log-opts=--all --redact .
          /tmp/gitleaks dir --redact .

  signing-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Ward does not sign
        run: python scripts/check_signing_boundary.py

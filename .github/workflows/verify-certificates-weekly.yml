name: Weekly Certificate Reproducibility

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: verify-certificates-weekly
  cancel-in-progress: false

jobs:
  verify:
    name: Re-query pinned certificate ledgers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Check historical certificate ledgers
        id: certificate_check
        shell: bash
        run: |
          set +e
          python scripts/check_certificate_reproducibility.py \
            --fail-on-unreproducible \
            --fail-on-check-error
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Commit reproducibility status (only if changed)
        run: |
          status_file="docs/security/evidence/certificate-reproducibility-status.json"
          if [ -z "$(git status --porcelain -- "${status_file}")" ]; then
            echo "Certificate status unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "Will Flores"
          git config user.email "wflores@wardprotocol.org"
          git add "${status_file}"
          git commit -m "chore(evidence): refresh certificate reproducibility status"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail visibly for stale ledgers or RPC errors
        if: steps.certificate_check.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.certificate_check.outputs.exit_code }}
        run: |
          echo "Certificate reproducibility check reported status ${EXIT_CODE}."
          cat docs/security/evidence/certificate-reproducibility-status.json
          exit "${EXIT_CODE}"
